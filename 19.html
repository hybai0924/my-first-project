<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>雨夜日式便利店街角微缩景观 - 3D Cel-Shaded Diorama</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080d1a;
      touch-action: none;
    }
    #diorama-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
    }
    #diorama-canvas:active {
      cursor: grabbing;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <canvas id="diorama-canvas"></canvas>
  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 1. SCENE, CAMERA, RENDERER & ORBIT CONTROLS (ZERO UI, PURE 3D DIORAMA)
      // =========================================================================
      const canvas = document.getElementById('diorama-canvas');
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      if (renderer.outputEncoding !== undefined) {
        renderer.outputEncoding = THREE.sRGBEncoding;
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x090f1d);
      scene.fog = new THREE.FogExp2(0x0c1528, 0.0105);

      const camera = new THREE.PerspectiveCamera(
        37,
        window.innerWidth / window.innerHeight,
        0.5,
        200
      );
      camera.position.set(22.8, 15.8, 24.8);

      // OrbitControls with built-in smooth fallback controller
      let controls = null;
      if (typeof THREE.OrbitControls === 'function') {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(-0.4, 2.2, -0.6);
        controls.enableDamping = true;
        controls.dampingFactor = 0.055;
        controls.rotateSpeed = 0.78;
        controls.zoomSpeed = 0.95;
        controls.panSpeed = 0.75;
        controls.minDistance = 7.5;
        controls.maxDistance = 55.0;
        controls.maxPolarAngle = Math.PI * 0.488;
        controls.minPolarAngle = 0.06;
        controls.update();
      } else {
        const spherical = { radius: 34.5, phi: 1.12, theta: 0.75 };
        const targetSpherical = { radius: 34.5, phi: 1.12, theta: 0.75 };
        const target = new THREE.Vector3(-0.4, 2.2, -0.6);
        const targetDest = new THREE.Vector3(-0.4, 2.2, -0.6);
        let isDragging = false;
        let dragMode = 'rotate';
        let prevX = 0, prevY = 0;

        const syncCamera = function () {
          spherical.radius += (targetSpherical.radius - spherical.radius) * 0.1;
          spherical.phi += (targetSpherical.phi - spherical.phi) * 0.1;
          spherical.theta += (targetSpherical.theta - spherical.theta) * 0.1;
          target.lerp(targetDest, 0.1);
          const sinPhi = Math.sin(spherical.phi);
          camera.position.set(
            target.x + spherical.radius * sinPhi * Math.sin(spherical.theta),
            target.y + spherical.radius * Math.cos(spherical.phi),
            target.z + spherical.radius * sinPhi * Math.cos(spherical.theta)
          );
          camera.lookAt(target);
        };

        canvas.addEventListener('pointerdown', function (e) {
          isDragging = true;
          dragMode = (e.button === 2 || e.shiftKey) ? 'pan' : 'rotate';
          prevX = e.clientX;
          prevY = e.clientY;
        });
        window.addEventListener('pointermove', function (e) {
          if (!isDragging) return;
          const dx = e.clientX - prevX;
          const dy = e.clientY - prevY;
          prevX = e.clientX;
          prevY = e.clientY;
          if (dragMode === 'rotate') {
            targetSpherical.theta -= dx * 0.0065;
            targetSpherical.phi = Math.max(0.08, Math.min(Math.PI * 0.488, targetSpherical.phi - dy * 0.0055));
          } else {
            const panScale = targetSpherical.radius * 0.0012;
            targetDest.x -= dx * panScale * Math.cos(targetSpherical.theta);
            targetDest.z += dx * panScale * Math.sin(targetSpherical.theta);
            targetDest.y += dy * panScale;
          }
        });
        window.addEventListener('pointerup', function () { isDragging = false; });
        canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        canvas.addEventListener('wheel', function (e) {
          e.preventDefault();
          targetSpherical.radius = Math.max(7.5, Math.min(55.0, targetSpherical.radius + e.deltaY * 0.02));
        }, { passive: false });
        controls = { update: syncCamera, target: target };
      }

      // =========================================================================
      // 2. ANIME NIGHT SKY DOME SHADER & CEL-SHADING (三渲二) ENGINE
      // =========================================================================
      // Atmospheric anime night sky dome with soft horizon glow
      const skyDomeGeo = new THREE.SphereGeometry(95, 32, 24);
      const skyDomeMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          uTime: { value: 0.0 }
        },
        vertexShader: [
          'varying vec3 vWorldPos;',
          'void main() {',
          '  vec4 wp = modelMatrix * vec4(position, 1.0);',
          '  vWorldPos = wp.xyz;',
          '  gl_Position = projectionMatrix * viewMatrix * wp;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'varying vec3 vWorldPos;',
          'uniform float uTime;',
          'void main() {',
          '  float h = normalize(vWorldPos).y;',
          '  vec3 zenith = vec3(0.035, 0.055, 0.115);',
          '  vec3 midSky = vec3(0.065, 0.105, 0.21);',
          '  vec3 horizon = vec3(0.11, 0.17, 0.30);',
          '  vec3 col = mix(horizon, midSky, smoothstep(-0.05, 0.28, h));',
          '  col = mix(col, zenith, smoothstep(0.28, 0.85, h));',
          '  gl_FragColor = vec4(col, 1.0);',
          '}'
        ].join('\n')
      });
      scene.add(new THREE.Mesh(skyDomeGeo, skyDomeMat));

      function createToonGradientTexture(steps) {
        const data = new Uint8Array(steps.length * 4);
        for (let i = 0; i < steps.length; i++) {
          const val = steps[i];
          data[i * 4] = val;
          data[i * 4 + 1] = val;
          data[i * 4 + 2] = val;
          data[i * 4 + 3] = 255;
        }
        const tex = new THREE.DataTexture(data, steps.length, 1, THREE.RGBAFormat);
        tex.minFilter = THREE.NearestFilter;
        tex.magFilter = THREE.NearestFilter;
        tex.generateMipmaps = false;
        tex.needsUpdate = true;
        return tex;
      }

      // Stepped anime cel-shading ramps
      const toonRamp3 = createToonGradientTexture([92, 172, 255]);
      const toonRamp4 = createToonGradientTexture([74, 136, 202, 255]);
      const toonRampSoft = createToonGradientTexture([102, 152, 198, 234, 255]);

      // Shared anime ink-line materials (三渲二清晰轮廓线)
      const exteriorOutlineMat = new THREE.LineBasicMaterial({
        color: 0x0e1525,
        transparent: true,
        opacity: 0.76
      });
      const interiorOutlineMat = new THREE.LineBasicMaterial({
        color: 0x3b2618,
        transparent: true,
        opacity: 0.54
      });
      const subtleOutlineMat = new THREE.LineBasicMaterial({
        color: 0x182338,
        transparent: true,
        opacity: 0.44
      });
      const hullOutlineMat = new THREE.MeshBasicMaterial({
        color: 0x0b101d,
        side: THREE.BackSide
      });

      const matCache = {};
      function getToonMat(hexColor, opts) {
        opts = opts || {};
        const key = hexColor + '_' + JSON.stringify(opts);
        if (matCache[key]) return matCache[key];
        const mat = new THREE.MeshToonMaterial({
          color: hexColor,
          gradientMap: opts.soft ? toonRampSoft : (opts.four ? toonRamp4 : toonRamp3),
          transparent: !!opts.transparent,
          opacity: opts.opacity !== undefined ? opts.opacity : 1.0,
          emissive: opts.emissive !== undefined ? opts.emissive : 0x000000,
          emissiveIntensity: opts.emissiveIntensity !== undefined ? opts.emissiveIntensity : 0.0,
          side: opts.side || THREE.FrontSide
        });
        matCache[key] = mat;
        return mat;
      }

      function getStandardMat(hexColor, opts) {
        opts = opts || {};
        return new THREE.MeshStandardMaterial({
          color: hexColor,
          roughness: opts.roughness !== undefined ? opts.roughness : 0.4,
          metalness: opts.metalness !== undefined ? opts.metalness : 0.1,
          transparent: !!opts.transparent,
          opacity: opts.opacity !== undefined ? opts.opacity : 1.0,
          emissive: opts.emissive !== undefined ? opts.emissive : 0x000000,
          emissiveIntensity: opts.emissiveIntensity !== undefined ? opts.emissiveIntensity : 0.0,
          side: opts.side || THREE.FrontSide
        });
      }

      function createAnimeMesh(geo, mat, opts) {
        opts = opts || {};
        const mesh = new THREE.Mesh(geo, mat);
        if (opts.castShadow !== false) mesh.castShadow = true;
        if (opts.receiveShadow !== false) mesh.receiveShadow = true;

        if (opts.outline !== false) {
          const threshold = opts.thresholdAngle || 24;
          const edgesGeo = new THREE.EdgesGeometry(geo, threshold);
          const lineMat = opts.interior ? interiorOutlineMat : (opts.subtle ? subtleOutlineMat : exteriorOutlineMat);
          const lines = new THREE.LineSegments(edgesGeo, lineMat);
          mesh.add(lines);
        }

        if (opts.hullScale) {
          const hull = new THREE.Mesh(geo, hullOutlineMat);
          hull.scale.setScalar(opts.hullScale);
          mesh.add(hull);
        }

        if (opts.pos) mesh.position.set(opts.pos[0], opts.pos[1], opts.pos[2]);
        if (opts.rot) mesh.rotation.set(opts.rot[0], opts.rot[1], opts.rot[2]);
        if (opts.scale) mesh.scale.set(opts.scale[0], opts.scale[1], opts.scale[2]);
        if (opts.parent) opts.parent.add(mesh);
        return mesh;
      }

      const dioramaGroup = new THREE.Group();
      scene.add(dioramaGroup);

      // Mirrored reflection proxy group rendered under the wet asphalt & puddles
      const reflectionGroup = new THREE.Group();
      reflectionGroup.scale.y = -1;
      reflectionGroup.position.y = 0.02;
      dioramaGroup.add(reflectionGroup);

      // =========================================================================
      // 3. PROCEDURAL CANVAS2D ANIME TEXTURE GENERATORS
      // =========================================================================
      function makeCanvasTexture(width, height, drawFn) {
        const c = document.createElement('canvas');
        c.width = width;
        c.height = height;
        const ctx = c.getContext('2d');
        drawFn(ctx, width, height);
        const tex = new THREE.CanvasTexture(c);
        if (tex.encoding !== undefined) tex.encoding = THREE.sRGBEncoding;
        tex.needsUpdate = true;
        return tex;
      }

      // 3.1 Konbini Main Signboard Texture (雨夜マート / AMAYO MART 24H)
      const konbiniSignTex = makeCanvasTexture(1024, 256, function (ctx, w, h) {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#fffef9');
        grad.addColorStop(1, '#f4efe2');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // Classic Japanese Konbini vibrant stripes
        ctx.fillStyle = '#00a7e1';
        ctx.fillRect(0, 0, w, 34);
        ctx.fillStyle = '#ff6b1a';
        ctx.fillRect(0, 34, w, 18);

        ctx.fillStyle = '#009b4d';
        ctx.fillRect(0, h - 44, w, 44);
        ctx.fillStyle = '#ffba08';
        ctx.fillRect(0, h - 54, w, 10);

        // Left 24H Emblem Badge
        ctx.save();
        ctx.fillStyle = '#ff5714';
        ctx.beginPath();
        ctx.arc(105, h * 0.5, 62, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 44px "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('24H', 105, h * 0.44);
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText('OPEN', 105, h * 0.67);
        ctx.restore();

        // Main Japanese Brand Typography
        ctx.fillStyle = '#14243b';
        ctx.font = '900 78px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans CJK JP", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('雨夜マート', 195, h * 0.45);

        ctx.fillStyle = '#007ea7';
        ctx.font = '800 24px sans-serif';
        ctx.fillText('AMAYO MART • HOSHIMIZAKA 2-CHOME', 202, h * 0.72);

        const pills = [
          { text: '酒・たばこ', bg: '#e63946', x: 645 },
          { text: '銀行ATM', bg: '#009b4d', x: 785 },
          { text: '淹れたて珈琲', bg: '#6f4e37', x: 915 }
        ];
        pills.forEach(function (p) {
          ctx.fillStyle = p.bg;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(p.x - 58, 72, 116, 104, 14) : ctx.rect(p.x - 58, 72, 116, 104);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 22px sans-serif';
          ctx.textAlign = 'center';
          const parts = p.text.split('・');
          if (parts.length > 1) {
            ctx.fillText(parts[0], p.x, 108);
            ctx.fillText(parts[1], p.x, 144);
          } else {
            ctx.fillText(p.text.slice(0, 4), p.x, 108);
            ctx.fillText(p.text.slice(4), p.x, 144);
          }
        });
      });

      // 3.2 Freestanding Street Corner Pylon Sign Texture (立柱灯箱)
      const pylonSignTex = makeCanvasTexture(256, 512, function (ctx, w, h) {
        ctx.fillStyle = '#fffcf2';
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#00a7e1';
        ctx.fillRect(0, 0, 22, h);
        ctx.fillStyle = '#009b4d';
        ctx.fillRect(w - 22, 0, 22, h);

        ctx.fillStyle = '#ff6b1a';
        ctx.beginPath();
        ctx.arc(w / 2, 78, 52, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 38px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('24H', w / 2, 78);

        const chars = ['雨', '夜', 'マ', 'ー', 'ト'];
        ctx.fillStyle = '#14243b';
        ctx.font = '900 44px sans-serif';
        chars.forEach(function (ch, idx) {
          ctx.fillText(ch, w / 2, 168 + idx * 48);
        });

        ctx.fillStyle = '#e63946';
        ctx.fillRect(32, 395, w - 64, 44);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText('酒 • たばこ • ATM', w / 2, 418);

        ctx.fillStyle = '#1d3557';
        ctx.fillRect(32, 448, w - 64, 46);
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 28px sans-serif';
        ctx.fillText('P 駐車場あり', w / 2, 472);
      });

      // 3.3 Vending Machine Front Texture (Red & Blue Variants)
      function makeVendingTex(themeColor, headerText) {
        return makeCanvasTexture(256, 512, function (ctx, w, h) {
          ctx.fillStyle = themeColor;
          ctx.fillRect(0, 0, w, h);

          ctx.fillStyle = '#f8f9fa';
          ctx.fillRect(18, 22, w - 36, 250);
          ctx.fillStyle = '#e9ecef';
          ctx.fillRect(24, 28, w - 48, 238);

          const rowY = [95, 172, 248];
          rowY.forEach(function (ry, rIdx) {
            ctx.fillStyle = '#adb5bd';
            ctx.fillRect(24, ry - 18, w - 48, 6);
            ctx.fillStyle = (rIdx === 2) ? '#f76707' : '#1c7ed6';
            ctx.fillRect(24, ry - 12, w - 48, 14);
            for (let b = 0; b < 6; b++) {
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(32 + b * 33, ry + 4, 24, 10);
              ctx.fillStyle = (rIdx === 2) ? '#ff922b' : '#74c0fc';
              ctx.fillRect(35 + b * 33, ry + 6, 18, 6);
            }
          });

          ctx.fillStyle = '#212529';
          ctx.fillRect(18, 284, w - 36, 76);

          const pGrad = ctx.createLinearGradient(24, 290, 145, 354);
          pGrad.addColorStop(0, '#4cc9f0');
          pGrad.addColorStop(1, '#4361ee');
          ctx.fillStyle = pGrad;
          ctx.fillRect(26, 292, 122, 60);
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 20px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(headerText, 87, 326);

          ctx.fillStyle = '#000000';
          ctx.fillRect(160, 294, 68, 24);
          ctx.fillStyle = '#ff4d4d';
          ctx.font = 'bold 18px monospace';
          ctx.fillText('130', 194, 312);

          ctx.fillStyle = '#ced4da';
          ctx.fillRect(168, 326, 52, 26);

          ctx.fillStyle = '#16191d';
          ctx.fillRect(28, 384, w - 56, 92);
          ctx.fillStyle = '#343a40';
          ctx.fillRect(36, 392, w - 72, 68);
          ctx.fillStyle = '#868e96';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText('PUSH / とりだし口', w / 2, 428);
        });
      }
      const vendingRedTex = makeVendingTex('#d92b2b', '24H DRINK');
      const vendingBlueTex = makeVendingTex('#1d6ec9', 'ICE COFFEE');

      // 3.4 Promotional Window Posters & Interior Category Lightboxes
      function makePosterTex(bgTop, bgBot, title, sub, price) {
        return makeCanvasTexture(256, 360, function (ctx, w, h) {
          const g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, bgTop);
          g.addColorStop(1, bgBot);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 8;
          ctx.strokeRect(10, 10, w - 20, h - 20);

          ctx.fillStyle = '#ffffff';
          ctx.font = '900 34px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(title, w / 2, 74);

          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          ctx.beginPath();
          ctx.arc(w / 2, 178, 68, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = bgBot;
          ctx.font = 'bold 28px sans-serif';
          ctx.fillText(sub, w / 2, 185);

          ctx.fillStyle = '#ffe066';
          ctx.font = '900 44px sans-serif';
          ctx.fillText(price, w / 2, 305);
        });
      }
      const posterCoffeeTex = makePosterTex('#3d2314', '#7f4f24', '挽きたて珈琲', 'HOT / ICE', '¥110');
      const posterOdenTex = makePosterTex('#d9480f', '#f76707', 'あったかおでん', 'だし自慢', '¥100~');
      const posterBentoTex = makePosterTex('#2b9348', '#55a630', '新発売 弁当', '特製おにぎり', '¥140~');
      const posterSweetsTex = makePosterTex('#e05286', '#f08c00', '夜限定スイーツ', '極上プリン', '¥240');

      // 3.5 Community Bulletin Board Collage Texture (小型公告栏)
      const bulletinBoardTex = makeCanvasTexture(512, 320, function (ctx, w, h) {
        ctx.fillStyle = '#8d6748';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#7a5638';
        for (let i = 0; i < 40; i++) {
          ctx.fillRect((i * 73) % w, (i * 47) % h, 18, 6);
        }

        ctx.fillStyle = '#f8f9fa';
        ctx.fillRect(16, 12, w - 32, 36);
        ctx.fillStyle = '#1d3557';
        ctx.font = '900 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('星見坂二丁目 町内会掲示板', w / 2, 37);

        const flyers = [
          { x: 24, y: 62, fw: 136, fh: 185, bg: '#fff3bf', title: '夏祭り花火', sub: '8月24日 開催', bar: '#e63946' },
          { x: 174, y: 58, fw: 150, fh: 112, bg: '#e3fafc', title: '資源回収日', sub: '毎週水・土曜日', bar: '#0ca678' },
          { x: 178, y: 182, fw: 146, fh: 118, bg: '#fff0f6', title: '迷い猫探してます', sub: '黒猫・赤い首輪', bar: '#f03e3e' },
          { x: 338, y: 64, fw: 148, fh: 228, bg: '#f8f9fa', title: '防犯パトロール', sub: '夜間照明点灯中', bar: '#1c7ed6' }
        ];
        flyers.forEach(function (f) {
          ctx.fillStyle = 'rgba(0,0,0,0.22)';
          ctx.fillRect(f.x + 4, f.y + 4, f.fw, f.fh);
          ctx.fillStyle = f.bg;
          ctx.fillRect(f.x, f.y, f.fw, f.fh);
          ctx.fillStyle = f.bar;
          ctx.fillRect(f.x, f.y, f.fw, 26);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText(f.title, f.x + f.fw / 2, f.y + 18);
          ctx.fillStyle = '#343a40';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText(f.sub, f.x + f.fw / 2, f.y + 56);
          ctx.fillStyle = '#adb5bd';
          for (let l = 0; l < 4; l++) {
            ctx.fillRect(f.x + 14, f.y + 76 + l * 18, f.fw - 28, 6);
          }
        });
      });

      // 3.6 Interior Ceiling Aisle Sign Texture
      function makeAisleSignTex(bgHex, textLeft, textRight) {
        return makeCanvasTexture(512, 96, function (ctx, w, h) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = bgHex;
          ctx.fillRect(0, 0, 140, h);
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 30px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(textLeft, 70, h / 2);

          ctx.fillStyle = '#1b263b';
          ctx.font = 'bold 32px sans-serif';
          ctx.fillText(textRight, 320, h / 2);
        });
      }
      const aisleSign1Tex = makeAisleSignTex('#009b4d', '1 • 2', 'お弁当 • おにぎり • サンド');
      const aisleSign2Tex = makeAisleSignTex('#ff6b1a', '3 • 4', 'お菓子 • カップ麺 • パン');
      const aisleSign3Tex = makeAisleSignTex('#00a7e1', '5 • 6', 'ドリンク • お酒 • アイス');

      // 3.7 Japanese Street Stop Sign, Road Sign & Izakaya Noren Textures
      const stopSignTex = makeCanvasTexture(256, 256, function (ctx, w, h) {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#e03131';
        ctx.beginPath();
        ctx.moveTo(16, 20);
        ctx.lineTo(w - 16, 20);
        ctx.lineTo(w / 2, h - 16);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 10;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 44px sans-serif';
        ctx.textAlign = 'center';

        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.48 })
      );
      reflFasciaFront.position.set(-1.6, 4.8, 1.1);
      reflectionGroup.add(reflFasciaFront);

      const reflFasciaOrange = new THREE.Mesh(
        new THREE.BoxGeometry(11.3, 0.45, 0.42),
        new THREE.MeshBasicMaterial({ color: 0xff6b1a, transparent: true, opacity: 0.52 })
      );
      reflFasciaOrange.position.set(-1.6, 4.3, 1.12);
      reflectionGroup.add(reflFasciaOrange);

      const reflFasciaSide = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 1.1, 12.6),
        new THREE.MeshBasicMaterial({ color: 0x00a7e1, transparent: true, opacity: 0.45 })
      );
      reflFasciaSide.position.set(3.9, 4.8, -5.2);
      reflectionGroup.add(reflFasciaSide);

      const reflVendingRed = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 2.2, 0.8),
        new THREE.MeshBasicMaterial({ color: 0xff4d6d, transparent: true, opacity: 0.46 })
      );
      reflVendingRed.position.set(-6.35, 1.35, 1.5);
      reflectionGroup.add(reflVendingRed);

      const reflVendingBlue = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 2.2, 0.8),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.48 })
      );
      reflVendingBlue.position.set(-5.05, 1.35, 1.5);
      reflectionGroup.add(reflVendingBlue);

      const reflPylon = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 2.4, 0.4),
        new THREE.MeshBasicMaterial({ color: 0xff922b, transparent: true, opacity: 0.5 })
      );
      reflPylon.position.set(3.85, 5.2, 2.55);
      reflectionGroup.add(reflPylon);

      const reflTrafficGlow = new THREE.Mesh(
        new THREE.SphereGeometry(1.35, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.45 })
      );
      reflTrafficGlow.position.set(7.0, 2.2, -5.5);
      reflectionGroup.add(reflTrafficGlow);

      const wetStreakGeo = new THREE.PlaneGeometry(3.2, 4.8);
      const wetWarmStreakMat = new THREE.MeshBasicMaterial({
        color: 0xffcf70,
        transparent: true,
        opacity: 0.18,
        depthWrite: false
      });
      const doorWetReflection = new THREE.Mesh(wetStreakGeo, wetWarmStreakMat);
      doorWetReflection.rotation.x = -Math.PI / 2;
      doorWetReflection.position.set(-0.95, 0.026, 6.2);
      dioramaGroup.add(doorWetReflection);

      const trafficWetReflectionMat = new THREE.MeshBasicMaterial({
        color: 0x22c55e,
        transparent: true,
        opacity: 0.2,
        depthWrite: false
      });
      const trafficWetReflection = new THREE.Mesh(
        new THREE.PlaneGeometry(3.6, 5.2),
        trafficWetReflectionMat
      );
      trafficWetReflection.rotation.x = -Math.PI / 2;
      trafficWetReflection.position.set(7.8, 0.026, -3.5);
      dioramaGroup.add(trafficWetReflection);

      // =========================================================================
      // 10. DYNAMIC LIFE & WEATHER ANIMATION SYSTEMS (8大动态生命力系统)
      // =========================================================================
      // 10.1 Continuous Slanted Anime Rainfall (持续降雨 — 1,500 rain streaks)
      const RAIN_COUNT = 1500;
      const rainPositions = new Float32Array(RAIN_COUNT * 6);
      const rainVelocities = new Float32Array(RAIN_COUNT);
      for (let i = 0; i < RAIN_COUNT; i++) {
        const rx = (Math.random() - 0.5) * 25.2;
        const ry = Math.random() * 16.0 + 0.5;
        const rz = (Math.random() - 0.5) * 25.2;
        const streakLen = 0.65 + Math.random() * 0.45;
        rainPositions[i * 6] = rx;
        rainPositions[i * 6 + 1] = ry;
        rainPositions[i * 6 + 2] = rz;
        rainPositions[i * 6 + 3] = rx - 0.09;
        rainPositions[i * 6 + 4] = ry - streakLen;
        rainPositions[i * 6 + 5] = rz + 0.06;
        rainVelocities[i] = 15.5 + Math.random() * 6.5;
      }
      const rainGeo = new THREE.BufferGeometry();
      rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
      const rainMat = new THREE.LineBasicMaterial({
        color: 0xa5c4ff,
        transparent: true,
        opacity: 0.36
      });
      const rainSystem = new THREE.LineSegments(rainGeo, rainMat);
      dioramaGroup.add(rainSystem);

      // 10.2 Eaves Water Droplets Dripping & Sidewalk Splash (屋檐滴水)
      const EAVE_DROP_COUNT = 26;
      const eaveDrops = [];
      const dropGeo = new THREE.SphereGeometry(0.032, 6, 6);
      dropGeo.scale(0.8, 1.8, 0.8);
      const dropMat = new THREE.MeshBasicMaterial({
        color: 0xdbeafe,
        transparent: true,
        opacity: 0.85
      });

      for (let i = 0; i < EAVE_DROP_COUNT; i++) {
        const isFront = i < 16;
        const dx = isFront ? (-6.8 + (i / 15) * 10.4) : 4.82;
        const dz = isFront ? 2.15 : (-8.0 + ((i - 16) / 9) * 8.4);
        const dropMesh = new THREE.Mesh(dropGeo, dropMat);
        dropMesh.position.set(dx, 3.82, dz);
        dioramaGroup.add(dropMesh);

        const splashRing = new THREE.Mesh(
          new THREE.RingGeometry(0.03, 0.06, 16),
          new THREE.MeshBasicMaterial({
            color: 0xbfdbfe,
            transparent: true,
            opacity: 0.0,
            side: THREE.DoubleSide
          })
        );
        splashRing.rotation.x = -Math.PI / 2;
        splashRing.position.set(dx, 0.255, dz);
        dioramaGroup.add(splashRing);

        eaveDrops.push({
          mesh: dropMesh,
          splash: splashRing,
          x: dx,
          z: dz,
          phase: Math.random() * 2.5,
          speed: 1.2 + Math.random() * 0.55
        });
      }

      // 10.3 Ground Puddle Concentric Ripples (地面积水波纹 — 50 animated rings)
      const RIPPLE_COUNT = 50;
      const ripples = [];
      const rippleBaseGeo = new THREE.RingGeometry(0.08, 0.105, 24);
      for (let i = 0; i < RIPPLE_COUNT; i++) {
        const rMat = new THREE.MeshBasicMaterial({
          color: i % 3 === 0 ? 0x93c5fd : 0xe0f2fe,
          transparent: true,
          opacity: 0.6,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const rMesh = new THREE.Mesh(rippleBaseGeo, rMat);
        rMesh.rotation.x = -Math.PI / 2;

        const pRef = puddleDefs[i % puddleDefs.length];
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 0.72;
        const rx = pRef.x + Math.cos(angle) * pRef.rx * dist;
        const rz = pRef.z + Math.sin(angle) * pRef.rz * dist;
        const ry = (pRef.y !== undefined ? pRef.y : 0.022) + 0.012;
        rMesh.position.set(rx, ry, rz);
        dioramaGroup.add(rMesh);

        ripples.push({
          mesh: rMesh,
          mat: rMat,
          progress: Math.random(),
          speed: 0.45 + Math.random() * 0.45,
          maxScale: 1.8 + Math.random() * 2.2
        });
      }

      // 10.4 Rainwater Sliding Down Storefront Glass Windows (雨水沿玻璃滑落)
      const GLASS_DROP_COUNT = 42;
      const glassDrops = [];
      const glassDropGeo = new THREE.BoxGeometry(0.018, 0.18, 0.018);
      const glassDropMat = new THREE.MeshBasicMaterial({
        color: 0xe0f2fe,
        transparent: true,
        opacity: 0.65
      });

      for (let i = 0; i < GLASS_DROP_COUNT; i++) {
        const onFront = i < 20;
        const gx = onFront
          ? (i < 8 ? (-4.1 + (i / 7) * 1.3) : (0.85 + ((i - 8) / 11) * 2.6))
          : 3.73;
        const gz = onFront ? 0.91 : (-7.9 + ((i - 20) / 21) * 8.4);
        const gMesh = new THREE.Mesh(glassDropGeo, glassDropMat);
        const startY = 1.0 + Math.random() * 2.4;
        gMesh.position.set(gx, startY, gz);
        storeGroup.add(gMesh);

        glassDrops.push({
          mesh: gMesh,
          y: startY,
          speed: 0.35 + Math.random() * 0.45
        });
      }

      // 10.5 Rising Warm Steam Particles Above the Interior Oden Pot (关东煮袅袅热气)
      const steamWisps = [];
      for (let i = 0; i < 10; i++) {
        const sMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.35,
          depthWrite: false
        });
        const sMesh = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), sMat);
        const sx = -3.02 + (Math.random() - 0.5) * 0.45;
        const sz = -1.4 + (Math.random() - 0.5) * 0.35;
        sMesh.position.set(sx, 1.35 + Math.random() * 0.4, sz);
        interiorGroup.add(sMesh);
        steamWisps.push({
          mesh: sMesh,
          mat: sMat,
          baseX: sx,
          baseZ: sz,
          progress: Math.random()
        });
      }

      // =========================================================================
      // 11. MAIN ANIMATION LOOP & RESIZE HANDLER
      // =========================================================================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.getElapsedTime();

        puddleShaderMat.uniforms.uTime.value = elapsed;
        skyDomeMat.uniforms.uTime.value = elapsed;

        if (controls && typeof controls.update === 'function') {
          controls.update();
        }

        // 1) Continuous slanted rainfall update
        const posAttr = rainGeo.attributes.position;
        const arr = posAttr.array;
        for (let i = 0; i < RAIN_COUNT; i++) {
          const vy = rainVelocities[i] * dt;
          const vx = -vy * 0.11;
          const vz = vy * 0.07;
          arr[i * 6] += vx;
          arr[i * 6 + 1] -= vy;
          arr[i * 6 + 2] += vz;
          arr[i * 6 + 3] += vx;
          arr[i * 6 + 4] -= vy;
          arr[i * 6 + 5] += vz;

          if (arr[i * 6 + 1] < 0.1) {
            const resetX = (Math.random() - 0.5) * 25.0;
            const resetY = 15.5 + Math.random() * 2.0;
            const resetZ = (Math.random() - 0.5) * 25.0;
            arr[i * 6] = resetX;
            arr[i * 6 + 1] = resetY;
            arr[i * 6 + 2] = resetZ;
            arr[i * 6 + 3] = resetX - 0.09;
            arr[i * 6 + 4] = resetY - 0.85;
            arr[i * 6 + 5] = resetZ + 0.06;
          }
        }
        posAttr.needsUpdate = true;

        // 2) Eaves water droplets swelling, falling & sidewalk splash rings
        for (let i = 0; i < EAVE_DROP_COUNT; i++) {
          const dObj = eaveDrops[i];
          const t = (elapsed * dObj.speed + dObj.phase) % 2.2;
          if (t < 0.7) {
            dObj.mesh.visible = true;
            dObj.mesh.position.y = 3.82;
            const swell = 0.4 + (t / 0.7) * 0.75;
            dObj.mesh.scale.setScalar(swell);
            dObj.splash.material.opacity = 0;
          } else if (t < 1.35) {
            const fallProgress = (t - 0.7) / 0.65;
            dObj.mesh.position.y = 3.82 - fallProgress * fallProgress * 3.55;
            dObj.mesh.scale.set(0.8, 1.4, 0.8);
            dObj.splash.material.opacity = 0;
          } else {
            dObj.mesh.visible = false;
            const sp = (t - 1.35) / 0.85;
            dObj.splash.scale.setScalar(1.0 + sp * 3.4);
            dObj.splash.material.opacity = (1.0 - sp) * 0.65;
          }
        }

        // 3) Ground puddle concentric ripples expanding & fading
        for (let i = 0; i < RIPPLE_COUNT; i++) {
          const rp = ripples[i];
          rp.progress += dt * rp.speed;
          if (rp.progress >= 1.0) rp.progress -= 1.0;
          const sc = 0.25 + rp.progress * rp.maxScale;
          rp.mesh.scale.set(sc, sc, 1);
          rp.mat.opacity = (1.0 - rp.progress) * 0.52;
        }

        // 4) Rainwater droplets sliding down storefront glass windows
        for (let i = 0; i < GLASS_DROP_COUNT; i++) {
          const gd = glassDrops[i];
          gd.y -= dt * gd.speed;
          if (gd.y < 0.85) gd.y = 3.45;
          gd.mesh.position.y = gd.y;
        }

        // 5) Automatic Sliding Doors periodic opening & closing + warm light spill
        const doorCycle = elapsed % 9.0;
        let openFactor = 0.0;
        if (doorCycle >= 3.5 && doorCycle < 4.5) {
          const p = (doorCycle - 3.5) / 1.0;
          openFactor = p * p * (3 - 2 * p);
        } else if (doorCycle >= 4.5 && doorCycle < 6.8) {
          openFactor = 1.0;
        } else if (doorCycle >= 6.8 && doorCycle < 7.8) {
          const p = 1.0 - (doorCycle - 6.8) / 1.0;
          openFactor = p * p * (3 - 2 * p);
        }
        leftSlidingDoor.position.x = -1.73 - openFactor * 1.18;
        rightSlidingDoor.position.x = -0.17 + openFactor * 1.18;
        storeWindowSpillLight.intensity = 1.42 + openFactor * 0.48;
        wetWarmStreakMat.opacity = 0.17 + openFactor * 0.1;
        puddleShaderMat.uniforms.uDoorOpen.value = openFactor;
        doorSensorLedMat.color.setHex(openFactor > 0.08 ? 0xf59e0b : 0x22c55e);

        // 6) Konbini Signboard & Alley Neon Subtle Flickering
        const flickerWave = Math.sin(elapsed * 23.0) * Math.sin(elapsed * 37.0);
        const isMicroFlicker = flickerWave > 0.84;
        signCaseMat.emissiveIntensity = isMicroFlicker ? 0.22 : (0.35 + Math.sin(elapsed * 2.5) * 0.03);
        alleyNeonSign.material.emissiveIntensity = (Math.sin(elapsed * 19.0) > 0.9) ? 0.25 : 0.82;
        reflFasciaFront.material.opacity = isMicroFlicker ? 0.3 : 0.48;

        // 7) Distant Traffic Signal Cycling & Synchronized Wet Road Reflection
        const sigCycle = elapsed % 12.0;
        if (sigCycle < 5.5) {
          sigGreenMat.color.setHex(0x22c55e);
          sigYellowMat.color.setHex(0x332811);
          sigRedMat.color.setHex(0x331118);
          trafficSignalLight.color.setHex(0x22c55e);
          reflTrafficGlow.material.color.setHex(0x22c55e);
          trafficWetReflectionMat.color.setHex(0x22c55e);
          puddleShaderMat.uniforms.uSignalColor.value.setHex(0x22c55e);
        } else if (sigCycle < 7.2) {
          sigGreenMat.color.setHex(0x112e1c);
          sigYellowMat.color.setHex(0xfacc15);
          sigRedMat.color.setHex(0x331118);
          trafficSignalLight.color.setHex(0xfacc15);
          reflTrafficGlow.material.color.setHex(0xfacc15);
          trafficWetReflectionMat.color.setHex(0xfacc15);
          puddleShaderMat.uniforms.uSignalColor.value.setHex(0xfacc15);
        } else {
          sigGreenMat.color.setHex(0x112e1c);
          sigYellowMat.color.setHex(0x332811);
          sigRedMat.color.setHex(0xef4444);
          trafficSignalLight.color.setHex(0xef4444);
          reflTrafficGlow.material.color.setHex(0xef4444);
          trafficWetReflectionMat.color.setHex(0xef4444);
          puddleShaderMat.uniforms.uSignalColor.value.setHex(0xef4444);
        }

        // 8) Outdoor AC Fans Rotating, Oden Steam Rising, Chochin & Noren Sway
        for (let i = 0; i < acFans.length; i++) {
          acFans[i].rotation.z -= dt * (6.5 + i * 0.8);
        }
        chochinGroup.rotation.z = Math.sin(elapsed * 1.8) * 0.045;
        chochinGroup.rotation.x = Math.cos(elapsed * 1.4) * 0.03;
        norenMesh.rotation.x = Math.sin(elapsed * 2.1) * 0.05;

        for (let i = 0; i < steamWisps.length; i++) {
          const sw = steamWisps[i];
          sw.progress = (sw.progress + dt * 0.45) % 1.0;
          sw.mesh.position.y = 1.25 + sw.progress * 0.42;
          sw.mesh.position.x = sw.baseX + Math.sin(elapsed * 2.5 + i) * 0.03;
          sw.mat.opacity = Math.sin(sw.progress * Math.PI) * 0.36;
        }

        renderer.render(scene, camera);
      }

      window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    })();
  </script>
</body>
</html>
